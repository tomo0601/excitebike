            }

            // 冷却装置アイテム（オーバーヒート防止）
            drawCooler(cx, baseY) {
                const bob = Math.sin(Date.now() / 200 + cx) * 2; // ふわふわ浮遊
                const topY = baseY - 18 + bob;
                // 接地影
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.beginPath();
                ctx.ellipse(cx, baseY + 4, 11, 4, 0, 0, Math.PI * 2);
                ctx.fill();
                // 光輪（目立たせる）
                ctx.fillStyle = 'rgba(120,220,255,0.25)';
                ctx.beginPath();
                ctx.arc(cx, topY + 6, 15, 0, Math.PI * 2);
                ctx.fill();
                // 本体（水色のボックス）
                ctx.fillStyle = '#3fc7e8';
                this.roundRect(cx - 9, topY, 18, 16, 3); ctx.fill();
                ctx.fillStyle = '#9fe8f7'; // 上面ハイライト
                this.roundRect(cx - 9, topY, 18, 5, 3); ctx.fill();
                ctx.strokeStyle = '#1b6f86';
                ctx.lineWidth = 1.5;
                this.roundRect(cx - 9, topY, 18, 16, 3); ctx.stroke();
                // 雪の結晶マーク（冷却の象徴）
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                const sx = cx, sy = topY + 8, r = 5;
                ctx.beginPath();
                for (let a = 0; a < Math.PI * 2; a += Math.PI / 3) {
                    ctx.moveTo(sx, sy);
                    ctx.lineTo(sx + Math.cos(a) * r, sy + Math.sin(a) * r);
                }
                ctx.stroke();
            }

            drawForegroundFence() {
                // コース手前端（最前レーンの先）の俵柵。HUDのすぐ上に並ぶ
                this.drawHayRow(GAME_HEIGHT - 74, 1.5);
            }

            drawBackground() {
                ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

                // --- スタンド（観客席）— このスタジアム視点では最奥の背景 ---
                this.drawGrandstand();

                // --- テントの帯 ---
                this.drawTent();

                // --- 芝生エリア (Y: 110 ~ 250) — NES風のベタ塗り緑 ---
                ctx.fillStyle = '#5cb83c';
                ctx.fillRect(0, 110, GAME_WIDTH, 140);
                // ごく控えめな芝目（横方向のうっすらした帯）
                ctx.fillStyle = '#54ac36';
                for (let y = 124; y < 248; y += 22) {
                    for (let x = -(cameraX * 0.5) % 56; x < GAME_WIDTH + 56; x += 56) {
                        ctx.fillRect(x, y, 26, 4);
                    }
                }
                // 芝生と土の境目：俵（干し草ロール）の柵
                this.drawHayRow(238, 1.0);
            }

            // 干し草の俵が横一列に並ぶ柵（柵・コース縁の共通描画）
            drawHayRow(topY, parallax) {
                const bw = 26;            // 俵1個の幅
                const bh = 16;            // 俵の高さ
                const off = (cameraX * parallax) % bw;
                for (let x = -off - bw; x < GAME_WIDTH + bw; x += bw) {
                    // 本体（角丸の俵）
                    ctx.fillStyle = '#d8a838';
                    this.roundRect(x + 1, topY, bw - 2, bh, 5);
                    ctx.fill();
                    // 上面ハイライト
                    ctx.fillStyle = '#ecc25a';
                    this.roundRect(x + 1, topY, bw - 2, 5, 4);
                    ctx.fill();
                    // 藁の巻き帯（縦のライン）と端の影
                    ctx.fillStyle = '#a87820';
                    ctx.fillRect(x + bw / 2 - 1, topY + 2, 2, bh - 4);
                    ctx.fillRect(x, topY + 3, 2, bh - 6);
                    // 下端の影
                    ctx.fillStyle = 'rgba(120,80,20,0.5)';
                    ctx.fillRect(x + 2, topY + bh - 3, bw - 4, 3);
                }
            }

            roundRect(x, y, w, h, r) {
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.arcTo(x + w, y, x + w, y + h, r);
                ctx.arcTo(x + w, y + h, x, y + h, r);
                ctx.arcTo(x, y + h, x, y, r);
                ctx.arcTo(x, y, x + w, y, r);
                ctx.closePath();
            }

            drawGrandstand() {
                // 観客席 (Y: 0 ~ 50) — 実機エキサイトバイク風のダイヤ柄
                ctx.fillStyle = '#f8f8f8';
                ctx.fillRect(0, 0, GAME_WIDTH, 50);

                // ダイヤ（菱形）格子。NES風の高彩度パレットで市松配置
                const dCols = ['#e8902c', '#f8f8f8', '#74b0e8', '#6cc040']; // 橙/白/水色/緑
                const dw = 24, dh = 17; // ダイヤ1個の幅/高さ
                const off = (cameraX * 0.1) % (dw * 2);
                for (let row = -1; row * dh < 56; row++) {
                    const cy = row * dh;
                    const stagger = (row % 2) * dw; // 段ごとに半個ずらす
                    for (let col = -2; col * (dw * 2) < GAME_WIDTH + dw * 2; col++) {
                        const cx = col * dw * 2 + stagger - off;
                        ctx.fillStyle = dCols[((row % 2) * 2 + (col % 2 + 2) % 2) % dCols.length];
                        ctx.beginPath();
                        ctx.moveTo(cx, cy);
                        ctx.lineTo(cx + dw / 2, cy + dh / 2);
                        ctx.lineTo(cx, cy + dh);
                        ctx.lineTo(cx - dw / 2, cy + dh / 2);
                        ctx.closePath();
                        ctx.fill();
                    }
                }

                // 観客席下端の白いギザギザ縁 (Y: 50 ~ 62)
                ctx.fillStyle = '#f8f8f8';
                ctx.fillRect(0, 48, GAME_WIDTH, 4);
                ctx.beginPath();
                const zz = 18;
                for (let x = -(cameraX * 0.15) % zz; x < GAME_WIDTH + zz; x += zz) {
                    ctx.moveTo(x, 52);
                    ctx.lineTo(x + zz / 2, 64);
                    ctx.lineTo(x + zz, 52);
                }
                ctx.fill();
            }

            drawTent() {
                // 青い空の帯 (Y: 62 ~ 110) — BESTタイム表示の背景
                ctx.fillStyle = '#3ca0e8';
                ctx.fillRect(0, 62, GAME_WIDTH, 48);
            }
        }

        const player = new Player();
        const networkPlayers = {}; // id -> Player
        const track = new Track();

        // --- ライバル3体（色・レーン・速度違い） ---
        const rivals = [
            new Rival({ frame: '#3498db', frameShade: '#1f6391', suit: '#ecf0f1', suitShade: '#aeb6bf', helmet: '#ffffff', lane: 0, baseSpeed: 9.3, startX: 220 }),
            new Rival({ frame: '#9b59b6', frameShade: '#633974', suit: '#bb8fce', suitShade: '#7d3c98', helmet: '#e056fd', lane: 2, baseSpeed: 9.7, startX: 170 }),
            new Rival({ frame: '#16a085', frameShade: '#0b5345', suit: '#7dcea0', suitShade: '#1e8449', helmet: '#abebc6', lane: 3, baseSpeed: 8.9, startX: 270 }),
        ];

        if (isController) {
            let hostState = null;
            if (socket) {
                socket.on('host_state', (data) => {
                    hostState = data;
                });
                socket.on('track_data', (data) => {
                    // トラックデータを同期
                    track.obstacles = data.obstacles.map(o => ({
                        x: o.x, width: o.width, height: o.height, type: o.type, hasDirt: o.hasDirt
                    }));
                    track.length = data.length;
                    gameState = STATE_PLAYING;
                });
            }
            window.update = () => {}; 
            window.draw = () => {
                ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
                if (!hostState) return;
                cameraX = hostState.cameraX;
                timeDisplay.textContent = hostState.time;
                track.drawClient(hostState.players);
            };
            window.gameLoop = () => {
                window.draw();
                animationId = requestAnimationFrame(window.gameLoop);
            };
        }
        // --- メインループ ---
        function update(timestamp) {
            if (gameState === STATE_COUNTDOWN) {
                // カウントダウン中はバイクを動かさない。3秒後にGO!
                if (timestamp - countdownStart >= 3000) {
                    gameState = STATE_PLAYING;
                    startTime = timestamp;
                }
                updateParticles();
                keysJustPressed.ArrowUp = false; keysJustPressed.ArrowDown = false;
                return;
            }
            if (gameState === STATE_PLAYING) {
                elapsedTime = timestamp - startTime;
                updateTimeDisplay(elapsedTime);

                if (player.x >= track.goalX) { // ゴール判定
                    gameState = STATE_GAMEOVER;
                    gameFinished();
                    return;
                }
            }
            if (gameState === STATE_PLAYING || gameState === STATE_CRASHED) {
                player.update();
                for (const id in networkPlayers) networkPlayers[id].update();
                for (const rv of rivals) rv.update();
            }
            updateParticles();
            keysJustPressed.ArrowUp = false; keysJustPressed.ArrowDown = false;
            
            // --- ホスト状態のブロードキャスト ---
            if (!isController && socket && (gameState === STATE_PLAYING || gameState === STATE_COUNTDOWN || gameState === STATE_CRASHED)) {
                const stateData = {
                    state: gameState,
                    cameraX: cameraX,
                    time: timeDisplay.textContent,
                    players: {}
                };
                if (!isHostOnly) {
                    stateData.players['host'] = {
                        x: player.x, y: player.y, angle: player.angle, currentLane: player.currentLane,
                        vx: player.vx, vy: player.vy, speed: player.speed, isGrounded: player.isGrounded,
                        overheated: player.overheated, crashTimer: player.crashTimer, wheelSpin: player.wheelSpin,
                        colorConfig: player.colorConfig
                    };
                }
                for (const id in networkPlayers) {
                    const np = networkPlayers[id];
                    stateData.players[id] = {
                        x: np.x, y: np.y, angle: np.angle, currentLane: np.currentLane,
                        vx: np.vx, vy: np.vy, speed: np.speed, isGrounded: np.isGrounded,
                        overheated: np.overheated, crashTimer: np.crashTimer, wheelSpin: np.wheelSpin,
                        colorConfig: np.colorConfig
                    };
                }
                socket.emit('host_state', stateData);
            }
        }

        function draw() {
            track.draw(player);
            // パーティクル（地形・バイクの上に重ねる）
            drawParticles();

            // スタートのカウントダウン・シグナル（3→2→1→GO!）
            const ct = performance.now() - countdownStart;
            if (gameState === STATE_COUNTDOWN || (gameState === STATE_PLAYING && ct < 3850)) {
                drawStartSignal(ct);
            }

            // ラップ＆順位表示（青い帯の中）
            if (gameState === STATE_PLAYING || gameState === STATE_CRASHED) {
                const lap = Math.min(track.laps, Math.floor(player.x / track.lapLength) + 1);
                let ahead = 0; for (const rv of rivals) if (rv.x > player.x) ahead++;
                const rank = ahead + 1;
                const ord = ['', '1ST', '2ND', '3RD', '4TH'][rank] || (rank + 'TH');
                ctx.font = 'bold 20px "Courier New", monospace';
                ctx.fillStyle = '#fff';
                ctx.textAlign = 'left';
                ctx.fillText('LAP ' + lap + '/' + track.laps, 18, 102);
                ctx.textAlign = 'right';
                ctx.fillStyle = (rank === 1) ? '#f1c40f' : '#fff';
                ctx.fillText(ord, GAME_WIDTH - 18, 102);
                ctx.textAlign = 'left';
            }

            // 高速時のスピードライン演出
            if (gameState === STATE_PLAYING && player.speed > 11) {
                const intensity = Math.min(1, (player.speed - 11) / 5);
                ctx.strokeStyle = `rgba(255,255,255,${0.12 + intensity * 0.18})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                for (let i = 0; i < 7; i++) {
                    const ly = 270 + (Math.sin(Date.now() / 50 + i * 2) * 0.5 + 0.5) * 180;
                    const lx = (Date.now() / 2 + i * 160) % (GAME_WIDTH + 120) - 60;
                    ctx.moveTo(lx, ly);
                    ctx.lineTo(lx - 40 - intensity * 30, ly);
                }
                ctx.stroke();
            }

            if (gameState === STATE_CRASHED) {
                // 画面を軽くフラッシュ
                ctx.fillStyle = 'rgba(255,80,40,0.08)';
                ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
                ctx.font = 'bold 52px Impact'; ctx.textAlign = 'center';
                if (Math.floor(Date.now() / 200) % 2 === 0) {
                    ctx.fillStyle = '#000';
                    ctx.fillText('CRASH!', GAME_WIDTH / 2 + 3, GAME_HEIGHT / 2 + 3);
                    ctx.fillStyle = '#f1c40f';
                    ctx.fillText('CRASH!', GAME_WIDTH / 2, GAME_HEIGHT / 2);
                }
                ctx.textAlign = 'left';
            }
        }

        // スタート用の信号灯＋数字（3→2→1→GO!）
        function drawStartSignal(t) {
            const cx = GAME_WIDTH / 2, topY = 150;
            const go = t >= 3000;
            const sec = Math.floor(t / 1000);          // 0,1,2
            const lampsOn = go ? 3 : (3 - sec);        // 点灯ランプ数 3→2→1
            const lampR = 13, gap = 42;

            ctx.save();
            // パネル背景
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            const pw = gap * 3 + 24, ph = lampR * 2 + 22;
            ctx.fillRect(cx - pw / 2, topY - lampR - 11, pw, ph);
            ctx.strokeRect(cx - pw / 2, topY - lampR - 11, pw, ph);

            // 信号ランプ
            for (let i = 0; i < 3; i++) {
                const lx = cx + (i - 1) * gap;
                const lit = go ? true : (i < lampsOn);
                if (lit) {
                    const glow = ctx.createRadialGradient(lx, topY, 2, lx, topY, lampR + 6);
                    glow.addColorStop(0, go ? 'rgba(80,255,140,0.9)' : 'rgba(255,90,60,0.9)');
                    glow.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = glow;
                    ctx.beginPath(); ctx.arc(lx, topY, lampR + 6, 0, Math.PI * 2); ctx.fill();
                }
                ctx.fillStyle = lit ? (go ? '#2ecc71' : '#e74c3c') : '#401414';
                ctx.beginPath(); ctx.arc(lx, topY, lampR, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(lx, topY, lampR, 0, Math.PI * 2); ctx.stroke();
                if (lit) { // ハイライト
                    ctx.fillStyle = 'rgba(255,255,255,0.6)';
                    ctx.beginPath(); ctx.arc(lx - 4, topY - 4, 3, 0, Math.PI * 2); ctx.fill();
                }
            }

            // 数字 / GO!
            const label = go ? 'GO!' : String(3 - sec);
            ctx.textAlign = 'center';
            ctx.font = 'bold 60px Impact, sans-serif';
            const ly = topY + lampR + 62;
            ctx.fillStyle = '#000';
            ctx.fillText(label, cx + 3, ly + 3);
            ctx.fillStyle = go ? '#2ecc71' : '#f1c40f';
            ctx.fillText(label, cx, ly);
            ctx.textAlign = 'left';
            ctx.restore();
        }

        function gameLoop(timestamp) {
            update(timestamp);
            draw();
            // エンジン音（カウントダウンのアイドリング〜走行中の回転）
            const engineOn = (gameState === STATE_PLAYING || gameState === STATE_CRASHED || gameState === STATE_COUNTDOWN);
            sfx.updateEngine(player.speed, engineOn, keys.KeyZ && !player.overheated, player.overheated);
            if (gameState !== STATE_GAMEOVER) animationId = requestAnimationFrame(gameLoop);
        }

        // --- ゲーム進行管理 ---
        function startGame() {
            if (isHostOnly) {
                // ホスト専用なら自機の表示を隠すか、特別な状態にする
                player.x = -9999;
                player.currentLane = -1;
                document.getElementById('bottom-hud').style.display = 'none';
            }
            sfx.init(); sfx.resume(); // ユーザー操作のタイミングで音声を有効化
            gameState = STATE_COUNTDOWN;
            player.reset();
            for (const id in networkPlayers) networkPlayers[id].reset();
            track.generate();
            if (socket) {
                socket.emit('track_data', { length: track.length, obstacles: track.obstacles });
            }
            rivals.forEach(r => r.reset());
            cameraX = player.x - 150;
            messageOverlay.classList.add('hidden');
            topHud.classList.remove('hidden'); // プレイ中はBESTを表示
            countdownStart = performance.now();
            startTime = countdownStart + 3000; // 実計測はGO!から
            updateTimeDisplay(0);
            if (animationId) cancelAnimationFrame(animationId);
            gameLoop(countdownStart);
        }

        function gameFinished() {
            const finalTimeStr = formatTime(elapsedTime);
            gameTitle.textContent = "FINISH!";
            gameSubtitle.textContent = `TIME: ${finalTimeStr}`;
            startBtn.textContent = "RETRY";
            messageOverlay.classList.remove('hidden');
            topHud.classList.add('hidden');
            sfx.engineOff(); // ゴールでエンジン停止

            // ベストタイム更新
            const currentBest = parseTime(bestTime);
            if (elapsedTime < currentBest) {
                bestTime = finalTimeStr;
                bestTimeDisplay.textContent = bestTime;
                localStorage.setItem('exciteBikeBestTime', bestTime);
                gameSubtitle.textContent += " (NEW BEST!)";
            }
        }

        // 時間フォーマット (MM:SS:MS)
        function formatTime(ms) {
            const minutes = Math.floor(ms / 60000);
            const seconds = Math.floor((ms % 60000) / 1000);
            const centis = Math.floor((ms % 1000) / 10);
            return `${pad(minutes)}:${pad(seconds)}:${pad(centis)}`;
        }
        function pad(n) { return n < 10 ? '0' + n : n; }
        function parseTime(timeStr) {
            const parts = timeStr.split(':').map(Number);
            return parts[0] * 60000 + parts[1] * 1000 + parts[2] * 10;
        }
        function updateTimeDisplay(ms) { timeDisplay.textContent = formatTime(ms); }

        // --- イベントリスナー ---
        startBtnPlay.addEventListener('click', () => { isHostOnly = false; startGame(); });
        startBtnHost.addEventListener('click', () => { isHostOnly = true; startGame(); });

        if (!isController) {
            window.addEventListener('keydown', (e) => {
                const code = e.code;
                sfx.resume();
                if (keys.hasOwnProperty(code)) {
                    if (!player.keys[code] && player.keysJustPressed.hasOwnProperty(code)) player.keysJustPressed[code] = true;
                    player.keys[code] = true;
                    if (!keys[code] && keysJustPressed.hasOwnProperty(code)) keysJustPressed[code] = true;
                    keys[code] = true; e.preventDefault();
                }
            });
            window.addEventListener('keyup', (e) => {
                if (keys.hasOwnProperty(e.code)) {
                    keys[e.code] = false;
                    player.keys[e.code] = false;
                }
            });

            // ホスト・スタンドアロン時のモバイル操作（一応残す）
            function bindTouchHost(id, code) {
                const btn = document.getElementById(id);
                if (!btn) return;
                btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[code] = true; if (keysJustPressed.hasOwnProperty(code)) keysJustPressed[code] = true; });
                btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[code] = false; });
                btn.addEventListener('touchcancel', (e) => { e.preventDefault(); keys[code] = false; });
            }
            bindTouchHost('btn-accel', 'KeyX'); bindTouchHost('btn-turbo', 'KeyZ');
            bindTouchHost('btn-up', 'ArrowUp'); bindTouchHost('btn-down', 'ArrowDown');
            bindTouchHost('btn-left', 'ArrowLeft'); bindTouchHost('btn-right', 'ArrowRight');
        }

        // --- スマホ参加用QRコードの生成 ---
        (function setupJoinQR() {
            const qrImg = document.getElementById('qr-img');
            const qrUrl = document.getElementById('qr-url');
            const qrBox = document.getElementById('qr-box');
            if (!qrImg) return;
            const url = location.href.split('?')[0] + '?role=controller';
            qrUrl.textContent = url;
            // localhostだと別端末から繋がらないため注意書きを出す
            const qrNote = document.getElementById('qr-note');
            if (qrNote && /^(localhost|127\.0\.0\.1)/.test(location.hostname)) {
                qrNote.textContent = '※同じWi-Fi上でPCのIPアドレスで公開してください';
            }
            // QR画像（JSライブラリによるDataURI生成）
            if (typeof QRCode !== 'undefined') {
                QRCode.toDataURL(url, { width: 160, margin: 1 }, function (err, dataUrl) {
                    if (err) {
                        qrImg.style.display = 'none';
                    } else {
                        qrImg.src = dataUrl;
                    }
                });
            } else {
                qrImg.style.display = 'none';
            }
        })();

        // 初期描画
        if (!isController) {
            track.generate();
            track.draw(player);
        } else {
            // コントローラーでも初期描画を開始
            window.gameLoop();
        }
        } // End of "if (isController) { ... } else { ... }" block
    </script>
</body>
